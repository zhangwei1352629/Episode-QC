# Episode QC 中文简易标签模板
#
# 每个标签必须填写可读的英文“编码”和中文“名称”。
# 编码示例：task_incomplete、camera_blur；正式使用后不要修改。
# 分组、说明、范围、对象、严重程度、处理建议、快捷键、颜色全部可以省略。
# 多个范围或对象可用“、”连接，例如：时间点、区间。
#
# 可填写的范围：区间、时间点、整条、全部
# 可填写的对象：全局、画面、动捕、关节、全部
# 可填写的严重程度：轻微、一般、严重
# 可填写的处理建议：保留、保留但标记、裁剪、修复、重采、废弃、待复核

标签库名称: 通用质检标签
版本: "1.0.0"

标签:
  - 编码: task_incomplete
    名称: 动作未完成
    分组: 整体问题
    说明: 没有完成标注规范要求的完整动作
    范围: 整条
    严重程度: 严重
    处理建议: 重采

  - 编码: mocap_joint_jitter
    名称: 关节抖动
    分组: 动捕问题
    说明: 一个或多个关节出现明显高频抖动
    范围: 时间点、区间
    对象: 动捕、关节
    处理建议: 裁剪

  - 编码: mocap_tracking_lost
    名称: 追踪丢失
    分组: 动捕问题
    说明: 人体或关节追踪中断、漂移到明显错误的位置
    范围: 区间
    对象: 动捕、关节
    严重程度: 严重
    处理建议: 裁剪

  - 编码: camera_blur
    名称: 画面模糊
    分组: 画面问题
    说明: 画面持续模糊，无法看清任务动作
    范围: 时间点、区间、整条
    对象: 画面
    处理建议: 保留但标记

  - 编码: camera_freeze
    名称: 画面卡顿或冻结
    分组: 画面问题
    说明: 画面停止更新或出现明显卡顿
    范围: 区间
    对象: 画面
    处理建议: 裁剪

  # 下面是最简写法：编码和名称必填，其他配置由软件补齐。
  - 编码: person_interruption
    名称: 人员进入画面
