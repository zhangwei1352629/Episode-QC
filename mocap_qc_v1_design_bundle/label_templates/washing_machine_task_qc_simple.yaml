# 洗衣机任务中文简易标签库
# 每个标签必须填写稳定、可读的英文“编码”；名称和说明可按标注规范修改。

标签库名称: 洗衣机任务质检标签
版本: "1.0.0"

标签:
  - 编码: extra_foot_adjustment
    名称: 脚步调整较多
    分组: 动作与安全
    说明: 执行任务时出现较多额外脚步或频繁调整站位
    范围: 区间
    对象: 动捕
    严重程度: 轻微

  - 编码: retry_pick_clothes
    名称: 重新拿取衣物
    分组: 衣物处理
    说明: 首次拿取未成功，需要再次拿取衣物
    范围: 区间
    对象: 画面

  - 编码: clothes_drop
    名称: 衣物掉落
    分组: 衣物处理
    说明: 衣物从手中或目标位置掉落
    范围: 时间点、区间
    对象: 画面
    处理建议: 待复核

  - 编码: retry_open_door
    名称: 重新打开洗衣机门
    分组: 任务执行
    说明: 首次开门未成功，需要重新尝试
    范围: 区间
    对象: 画面

  - 编码: retry_place_clothes
    名称: 重新放入衣物
    分组: 衣物处理
    说明: 首次放置未成功，需要重新将衣物放入洗衣机
    范围: 区间
    对象: 画面

  - 编码: clothes_caught_in_door
    名称: 衣物被门夹住
    分组: 衣物处理
    说明: 关闭洗衣机门时衣物被门体或门缝夹住
    范围: 时间点、区间
    对象: 画面
    严重程度: 严重
    处理建议: 待复核

  - 编码: long_pause_overheat
    名称: 过热导致长时间停顿
    分组: 动作与安全
    说明: 因人员或设备过热，任务过程中出现明显长时间停顿
    范围: 区间
    严重程度: 严重
    处理建议: 待复核

  - 编码: body_sway
    名称: 身体明显晃动
    分组: 动作与安全
    说明: 执行动作时身体明显晃动或稳定性不足
    范围: 区间
    对象: 动捕

  - 编码: minor_collision
    名称: 轻微碰撞
    分组: 动作与安全
    说明: 身体、衣物或设备与周围物体发生轻微碰撞
    范围: 时间点、区间
    对象: 画面、动捕
    严重程度: 轻微
