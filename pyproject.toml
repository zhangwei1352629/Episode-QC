[project]
name = "episode-qc"
version = "0.1.0"
description = "Quality-control tools for episode MCAP datasets."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "imageio-ffmpeg>=0.6.0",
  "mcap>=1.4.0",
  "msgpack>=1.1.0",
  "numpy>=2.0",
  "pillow>=10.0",
  "pyyaml>=6.0",
]

[project.scripts]
episode-qc = "episode_qc.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"app/renderer" = "episode_qc/web_static"
"mocap_qc_v1_design_bundle/data_profile_v1.example.yaml" = "episode_qc/defaults/data_profile_v1.example.yaml"
"mocap_qc_v1_design_bundle/label_schema_v1.example.yaml" = "episode_qc/defaults/label_schema_v1.example.yaml"
